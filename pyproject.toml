[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ppsignal"
version = "0.1.0"
description = "Signal processing kernels written in POST Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "itsmepraks" }]
keywords = ["signal-processing", "scipy", "gufunc", "postpyc", "postyp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "postpyc>=0.3.0",
    "postyp>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "tomli>=2.0.1; python_version < \"3.11\""]

[project.urls]
Repository = "https://github.com/openteams-ai/ppsignal"
Standard = "https://github.com/openteams-ai/postpython/blob/main/docs/spec.md"

[tool.hatch.build.targets.wheel]
packages = ["ppsignal"]

[tool.hatch.build.targets.sdist]
include = [
    "ppsignal",
    "tests",
    "scripts",
    "README.md",
    "ROADMAP.md",
    "pyproject.toml",
]
