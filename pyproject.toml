[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ppsignal"
version = "0.1.0"
description = "Signal processing kernels, in POST Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "itsmepraks" },
]
keywords = [
    "signal-processing",
    "scipy",
    "gufunc",
    "postpyc",
    "postyp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "postpyc>=0.3.0",
    "postyp>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build>=1.2",
    "hatchling>=1.18",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/openteams-ai/ppsignal"
Standard = "https://github.com/openteams-ai/postpython/blob/main/docs/spec.md"

[tool.hatch.build.targets.wheel]
packages = ["ppsignal"]

[tool.hatch.build.targets.sdist]
include = [
    "ppsignal",
    "tests",
    "scripts",
    "README.md",
    "ROADMAP.md",
    "pyproject.toml",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.pypi-dependencies]
ppsignal = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.10"
c-compiler = "*"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7"
numpy = "*"

[tool.pixi.feature.dev.pypi-dependencies]
build = ">=1.2"
hatchling = ">=1.18"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = { cmd = "pytest tests/", description = "Run the test suite" }
build-dist = { cmd = "python -m build --no-isolation", description = "Build the sdist and wheel with the PyPI build frontend" }
build-native = { cmd = "python scripts/build_native.py", description = "Build the native compiler probe" }
build-ext = { cmd = "python scripts/build_ext.py", description = "Build the compiled extension module" }
build-prefix = { cmd = "postpyc build ppsignal/_compiler_probe.py --prefix dist/prefix --module-name ppsignal", description = "Build the compiler probe into a POST Python prefix" }
provenance = { cmd = "python scripts/compiler_provenance.py --output dist/provenance.json", description = "Capture compiler/SDK/package provenance" }
